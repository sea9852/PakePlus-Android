<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>打卡</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/punch.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/records.css">
<link rel="stylesheet" href="css/sheet.css">
</head>
<body>

<div id="app">

  <div id="pager">

    <!-- ============ 首页 · 打卡 ============ -->
    <section class="page page-punch" id="pagePunch">
      <header class="punch-top">
        <p class="today-week" id="todayWeek">星期一</p>
        <h1 class="today-date" id="todayDate">10月26日</h1>
      </header>

      <div class="punch-stage">
        <button class="punch-btn" id="punchBtn" type="button" aria-label="打卡">
          <span class="punch-ring"></span>
          <span class="punch-text">打卡</span>
        </button>
        <p class="punch-hint" id="punchHint">今天还没有打卡</p>
      </div>

      <section class="punch-today">
        <div class="punch-today-head">
          <span>今日记录</span>
          <button class="link-btn" id="viewAllBtn" type="button" hidden>查看全部</button>
        </div>
        <ul class="mini-list" id="miniList"></ul>
        <p class="mini-empty" id="miniEmpty">点一下上面的大按钮，完成今天的第一次打卡</p>
      </section>

      <p class="swipe-tip" id="swipeTip">左滑查看日历 →</p>
    </section>

    <!-- ============ 日历视图 ============ -->
    <section class="page page-calendar" id="pageCalendar">
      <header class="cal-head">
        <div class="cal-title">
          <span id="calYear">2026</span><span class="cal-sep">/</span><span class="cal-month" id="calMonth">10</span>
        </div>
        <button class="today-btn" id="todayBtn" type="button">今天</button>
      </header>

      <div class="cal-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>

      <div class="cal-body">
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div class="cal-divider">
        <span id="calDayLabel">10月26日 星期一</span>
        <span class="cal-divider-sub" id="calDaySub"></span>
      </div>

      <div class="cal-detail" id="calDetail">
        <div class="record-card">
          <div class="record-card-head">
            <span class="rc-title">打卡记录</span>
            <span class="rc-count" id="rcCount"></span>
          </div>
          <ol class="record-list" id="recordList"></ol>
          <div class="record-empty" id="recordEmpty">
            <span class="empty-icon"></span>
            <span>暂无记录</span>
          </div>
          <p class="record-tip" id="recordTip" hidden>长按记录可删除</p>
        </div>
        <button class="cal-month-stat" id="calStat" type="button"></button>
      </div>
    </section>

    <!-- ============ 全部记录 ============ -->
    <section class="page page-records" id="pageRecords">
      <header class="rec-head">
        <div>
          <h1 class="rec-title">全部记录</h1>
          <p class="rec-sub" id="recSub">共 0 天 · 0 次</p>
        </div>
        <button class="today-btn" id="recTodayBtn" type="button">今天</button>
      </header>

      <div class="rec-scroll" id="recScroll">
        <div class="rec-all-empty" id="recAllEmpty">
          <span class="empty-icon"></span>
          <span>还没有任何打卡记录</span>
          <span class="rec-all-empty-hint">回到首页，点一下绿色按钮开始</span>
        </div>
        <div id="recGroups"></div>
      </div>
    </section>

  </div>

  <div class="dots" id="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>

</div>

<!-- ============ 备注弹窗 ============ -->
<div class="mask" id="noteMask"></div>
<div class="sheet" id="noteSheet" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title" id="noteTitle">添加备注</h2>
  <p class="sheet-sub" id="noteTime"></p>
  <textarea class="note-input" id="noteInput" maxlength="120" rows="3"
            placeholder="写点什么…（可留空）" enterkeyhint="done"></textarea>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="noteCancel" type="button">取消</button>
    <button class="btn btn-primary" id="noteSave" type="button">确认打卡</button>
  </div>
</div>

<!-- ============ 删除确认弹窗 ============ -->
<div class="mask" id="delMask"></div>
<div class="sheet" id="delSheet" role="dialog" aria-modal="true" aria-labelledby="delTitle">
  <div class="sheet-handle"></div>
  <h2 class="sheet-title" id="delTitle">删除这条打卡？</h2>
  <p class="sheet-sub" id="delDesc"></p>
  <div class="sheet-actions">
    <button class="btn btn-ghost" id="delCancel" type="button">取消</button>
    <button class="btn btn-danger" id="delOk" type="button">删除</button>
  </div>
</div>

<script src="js/dateutil.js"></script>
<script src="js/store.js"></script>
<script src="js/pager.js"></script>
<script src="js/gestures.js"></script>
<script src="js/punch.js"></script>
<script src="js/calendar.js"></script>
<script src="js/records.js"></script>
<script src="js/app.js"></script>
</body>
</html>
